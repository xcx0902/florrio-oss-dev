schema: 1
name: worker-protocol
confidence: medium
notes:
  - This is the product's byte-level worker contract; generated C++/TypeScript views are the runtime source.
  - Fields whose exact wire type has not been proven are marked confidence medium and described by role, not invented names.

worker:
  request:
    fields:
      - { name: funcName, type: string, confidence: high }
      - { name: callbackId, type: i32, confidence: high, note: "-1 for init; otherwise a monotonically increasing client callback slot" }
      - { name: data, type: bytes, optional: true, confidence: high, note: "transferred Uint8Array; absent or zero-length for init/think/flush" }
  response:
    fields:
      - { name: callbackId, type: i32, confidence: high }
      - { name: finalResponse, type: bool, confidence: high, note: "true completes the callback; false is an intermediate packet" }
      - { name: data, type: bytes, optional: true, confidence: high }
  functions:
    - { name: sp_server_init, args: [0, 0], confidence: high, behavior: "initialize world and catalogs, schedule the 50 ms tick, flush initial output" }
    - { name: sp_server_send, args: [pointer, length], confidence: high, behavior: "decode one client input packet and apply its commands" }
    - { name: sp_server_think, args: [], confidence: high, behavior: "one 20 Hz simulation tick" }
    - { name: sp_server_flush, args: [0, 0], confidence: high, behavior: "drain the output queue, send one final empty response, free packets" }

input:
  maxPacketBytes: 65536
  xor:
    keyLength: 256
    algorithm: rolling-xor
    confidence: high
  reader:
    varint: unsigned-leb128
    maxVarintBytes: 5
    endian: little
    confidence: high
  packet:
    sequence: varint
    sequenceRole: duplicate suppression
    commands: command-list
  commands:
    - { opcode: 0, name: handshake-string, confidence: high }
    - { opcode: 2, name: handshake-string-alt, confidence: high }
    - { opcode: 3, name: suicide, confidence: high }
    - { opcode: 4, name: restart, confidence: high }
    - { opcode: 5, name: string, confidence: high }
    - { opcode: 6, name: player-spawn-and-name, confidence: high, fields: [name-string, level] }
    - { opcode: 7, name: disconnect, confidence: high }
    - { opcode: 8, name: discard-petal, confidence: high, fields: [slot] }
    - { opcode: 10, name: swap-petals, confidence: high, fields: [slotA, slotB] }
    - { opcode: 12, name: input-buttons-angle-strength, confidence: high, fields: [buttons, angle, strength] }
    - { opcode: 13, name: bench-cycle, confidence: high }
    - { opcode: 1, name: reserved-1, confidence: medium }
    - { opcode: 9, name: reserved-9, confidence: medium }
    - { opcode: 11, name: reserved-11, confidence: medium }
  fieldNotes:
    - "Opcode 12 angle uses fixed binary64 constants and a bit-level normalization test."
    - "Name strings are trimmed and UTF-8 truncated on the spawn path."

output:
  queue:
    capacity: 16
    confidence: high
  packet:
    headerBytes: 16
    lengthOffset: 4
    heapPayloadOffset: 12
    inlinePayloadOffset: 16
    inlinePayloadBytes: 4096
    confidence: high
  payload:
    typeByte: first
    types:
      - { type: 0, name: handshake, confidence: medium }
      - { type: 1, name: entity-snapshot, confidence: high }
      - { type: 5, name: events, confidence: high }
      - { type: 2, name: unknown-2, confidence: low }
  snapshot:
    sequence: varint
    xorKeyLength: 256
    reliableAck: varint
    framing:
      entityFlagsXor: 54
      componentDeltaXor: 1
    # Dense value widths and component mappings are shared by every packet.
    sparseModes:
      domainSparse:
        packetFormat: domain-counted
        fieldDeltaXor: 0
        indexDeltaXor: 0
        indexedFields: [3, 10, 16, 25, 39, 60, 61]
        field26Role: entity-kind
        note: "Domain semantics also include petal slot/instance fields11/12; see docs/semantics/snapshot.md."
      # Decoded zero terminates both field and index lists. Fields4/33/35 are
      # scalar. Indexed counts below describe component storage, not an added
      # validation bound on the existing domain stream.
    domainExtensions:
      - { field: 26, name: entity-kind, type: byte, permanent: true, note: "Domain packets retain the permanent kind byte; field 2 carries the catalog species." }
    entityHandle:
      bits: 32
      indexMask: 16383
      generationShift: 14
      rotation: rotl-14
      confidence: high
    blocks:
      - { name: entity-deletes, count: varint, entry: handle }
      - { name: entity-updates, count: varint, entry: handle + component-declarations + field-values }
      - { name: events, count: varint, entry: opcode + fields }
      - { name: trailing-framing, confidence: medium }
    componentModel:
      componentCount: 30
      sparseFieldCount: 63
      denseGroupCount: 19
      denseComponent30ExtraFields: 6
      flags:
        1: component declarations use a 32-bit mask
        2: skip component declarations
        8: dense existing-component fields
        64: dense component 30 includes fields 58-63
        128: mark entity byte 44 bit 0
      confidence: high
    fieldComponents:
      # Sparse field groups:
      # readField branches. Constructor 0 denotes an inline component, not an
      # unverified/default mapping. Domain field26 remains a permanent kind byte.
      1: { constructor: 478, offset: 8 }
      2: { constructor: 491, offset: 8 }
      3: { constructor: 477, offset: 8 }
      4: { constructor: 0, offset: 8 }
      5: { constructor: 478, offset: 16 }
      6: { constructor: 478, offset: 40 }
      7: { constructor: 467, offset: 8 }
