schema: 1
name: worker-protocol
confidence: medium
notes:
  - This is the product's byte-level worker contract; generated C++/TypeScript views are the runtime source.
  - Fields whose exact wire type has not been proven are marked confidence medium and described by role, not invented names.

worker:
  request:
    fields:
      - { name: funcName, type: string, confidence: high }
      - {
          name: callbackId,
          type: i32,
          confidence: high,
          note: '-1 for init; otherwise a monotonically increasing client callback slot',
        }
      - {
          name: data,
          type: bytes,
          optional: true,
          confidence: high,
          note: 'transferred Uint8Array; absent or zero-length for init/think/flush',
        }
  response:
    fields:
      - { name: callbackId, type: i32, confidence: high }
      - {
          name: finalResponse,
          type: bool,
          confidence: high,
          note: 'true completes the callback; false is an intermediate packet',
        }
      - { name: data, type: bytes, optional: true, confidence: high }
  # Entry points the Worker client calls. Argument types are the C declarations
  # in engine/include/engine/abi.h and the export list in
  # engine/abi-exports.json; this table records what each entry point does.
  functions:
    - {
        name: sp_server_init,
        confidence: high,
        behavior: 'initialize world and catalogs, schedule the 50 ms tick, flush initial output',
      }
    - {
        name: sp_server_send,
        confidence: high,
        behavior: 'decode one client input packet and apply its commands',
      }
    - { name: sp_server_think, confidence: high, behavior: 'one 20 Hz simulation tick' }
    - {
        name: sp_server_flush,
        confidence: high,
        behavior: 'drain the output queue, send one final empty response, free packets',
      }

input:
  maxPacketBytes: 65536
  xor:
    keyLength: 256
    algorithm: rolling-xor
    confidence: high
  reader:
    varint: unsigned-leb128
    maxVarintBytes: 5
    endian: little
    confidence: high
  packet:
    sequence: varint
    sequenceRole: duplicate suppression
    commands: command-list
  commands:
    - { opcode: 0, name: handshake-string, confidence: high }
    - { opcode: 2, name: handshake-string-alt, confidence: high }
    - { opcode: 3, name: suicide, confidence: high }
    - { opcode: 4, name: restart, confidence: high }
    - { opcode: 5, name: string, confidence: high }
    - { opcode: 6, name: player-spawn-and-name, confidence: high, fields: [name-string, level] }
    - { opcode: 7, name: disconnect, confidence: high }
    - { opcode: 8, name: discard-petal, confidence: high, fields: [slot] }
    - { opcode: 10, name: swap-petals, confidence: high, fields: [slotA, slotB] }
    - {
        opcode: 12,
        name: input-buttons-angle-strength,
        confidence: high,
        fields: [buttons, angle, strength],
      }
    - { opcode: 13, name: bench-cycle, confidence: high }
    - { opcode: 1, name: reserved-1, confidence: medium }
    - { opcode: 9, name: reserved-9, confidence: medium }
    - { opcode: 11, name: reserved-11, confidence: medium }
  fieldNotes:
    - 'Opcode 12 angle uses fixed binary64 constants and a bit-level normalization test.'
    - 'Name strings are trimmed and UTF-8 truncated on the spawn path.'

output:
  queue:
    capacity: 16
    confidence: high
  # Output packets are opaque byte payloads: OutputPacket owns a vector and the
  # Worker copies it out. There is no heap/inline struct layout to describe.
  payload:
    typeByte: first
    types:
      - { type: 0, name: handshake, confidence: medium }
      - { type: 1, name: entity-snapshot, confidence: high }
      - { type: 5, name: events, confidence: high }
      - { type: 2, name: unknown-2, confidence: low }
  snapshot:
    sequence: varint
    xorKeyLength: 256
    reliableAck: varint
    framing:
      entityFlagsXor: 54
      componentDeltaXor: 1
    # Dense value widths and component mappings are shared by every packet.
    sparseModes:
      domainSparse:
        packetFormat: domain-counted
        fieldDeltaXor: 0
        indexDeltaXor: 0
        indexedFields: [3, 10, 16, 25, 39, 60, 61]
        field26Role: entity-kind
        note: 'Domain semantics also include petal slot/instance fields11/12; see docs/semantics/snapshot.md.'
      # Decoded zero terminates both field and index lists. Fields4/33/35 are
      # scalar. Indexed counts below describe component storage, not an added
      # validation bound on the existing domain stream.
    domainExtensions:
      - {
          field: 26,
          name: entity-kind,
          type: byte,
          permanent: true,
          note: 'Domain packets retain the permanent kind byte; field 2 carries the catalog species.',
        }
    entityHandle:
      bits: 32
      indexMask: 16383
      generationShift: 14
      rotation: rotl-14
      confidence: high
    blocks:
      - { name: entity-deletes, count: varint, entry: handle }
      - {
          name: entity-updates,
          count: varint,
          entry: handle + component-declarations + field-values,
        }
      - { name: events, count: varint, entry: opcode + fields }
      - { name: trailing-framing, confidence: medium }
    componentModel:
      componentCount: 30
      sparseFieldCount: 63
      denseGroupCount: 19
      denseExtendedFieldCount: 6
      flags:
        1: component declarations use a 32-bit mask
        2: skip component declarations
        8: dense existing-component fields
        64: the identity component also carries fields 58-63
        128: arrival marker for this entity record
      confidence: high
    # Component identities. The key is the real component-declaration ordinal:
    # bit (ordinal - 1) of the update component mask. Every dense group below
    # carries the payload of one component; a component without a dense group is
    # a presence-only marker written by the replication path. Group fields are
    # the complete set of fields that component stores.
    components:
      1: { name: drop-state, note: 'drop species byte and collected flag' }
      2: { name: ai-activity, note: 'AI activity flags' }
      5: { name: petal-variant, note: 'petal variant flags: epic colour, large, launched' }
      6: { name: player-controller, note: 'camera target, profile/death bytes and viewer handle' }
      7: { name: petal-species, note: 'petal species tag byte' }
      8:
        { name: reserved-8, note: 'decode-only record; the product publishes none of these fields' }
      10:
        {
          name: reserved-10,
          note: 'decode-only record; the product publishes none of these fields',
        }
      12:
        {
          name: web-projectile-tag,
          payload: none,
          note: 'presence marker for a web-tagged projectile',
        }
      14:
        {
          name: reserved-14,
          note: 'decode-only record; the product publishes none of these fields',
        }
      15:
        {
          name: reserved-15,
          note: 'decode-only record; the product publishes none of these fields',
        }
      16: { name: loadout-record, note: 'equipped petal slot/instance and loadout arrays' }
      18: { name: projectile-tag, payload: none, note: 'presence marker for a projectile' }
      19:
        {
          name: reserved-19,
          note: 'decode-only record; the product publishes none of these fields',
        }
      20: { name: health, note: 'current and maximum health' }
      21: { name: transform, note: 'angle and visual position' }
      22:
        {
          name: reserved-22,
          note: 'decode-only record; the product publishes none of these fields',
        }
      25: { name: lifecycle, note: 'death-processed flag' }
      26: { name: collision-radius, note: 'physics collider radius' }
      27: { name: inline-record, note: 'public display name and decode-only inline values' }
      28:
        {
          name: reserved-28,
          note: 'decode-only record; the product publishes none of these fields',
        }
      30:
        { name: identity, note: 'look/species, kind, expression/variant, level progress and score' }
    indexedFields:
      3: { element: reference, count: 10 }
      4: { element: string, count: 1 }
      10: { element: string, count: 10 }
      16: { element: byte, count: 10 }
      25: { element: string, count: 1 }
      33: { element: bit, count: 1 }
      35: { element: f64, count: 1 }
      39: { element: varint, count: 10 }
      60: { element: byte, count: 16 }
      61: { element: short, count: 8 }
    fieldTypes:
      byte: [1, 2, 9, 11, 12, 14, 17, 20, 22, 26, 31, 34, 36, 38, 43, 46, 47, 50, 54, 62, 63]
      float: [19, 21, 32, 42, 53, 55]
      interpolatedFloat: [5, 7, 13, 24, 28, 49, 59]
      string: [4, 6, 48]
      varint: [15, 30, 41, 44, 51, 52, 58]
      reference: [23, 56, 57]
      bit: [29, 33, 37, 40]
      angleRaw16: [8]
      double: [18, 35]
      specialFloat: [27, 45]
      stringArray: [10, 25]
      byteArray: [16, 60]
      handleArray: [3]
      varintArray: [39]
      shortArray: [61]
      confidence: high
      note: 'Shared field value categories and dense widths. Consult sparseModes for indexed/scalar framing.'
    denseGroups:
      - { component: 1, fields: [22, 54] }
      - { component: 2, fields: [36] }
      - { component: 5, fields: [9] }
      - { component: 6, fields: [1, 5, 6, 16, 20, 21, 24, 32, 34, 47, 56] }
      - { component: 7, fields: [50] }
      - { component: 8, fields: [13, 37] }
      - { component: 10, fields: [17] }
      - { component: 14, fields: [43] }
      - { component: 15, fields: [23, 57] }
      - { component: 16, fields: [3, 10, 11, 12, 19, 30, 39, 42, 45, 46, 52] }
      - { component: 19, fields: [48] }
      - { component: 20, fields: [53, 55] }
      - { component: 21, fields: [8, 28, 49] }
      - { component: 22, fields: [29, 40] }
      - { component: 25, fields: [38] }
      - { component: 26, fields: [7] }
      - { component: 27, fields: [4, 15, 18, 25, 27, 33, 35, 41, 44, 51] }
      - { component: 28, fields: [14] }
      - { component: 30, fields: [2, 26, 31], extendedFields: [58, 59, 60, 61, 62, 63] }
    events:
      - { opcode: 9, name: chat-string, confidence: high }
      - { opcode: 11, name: entity-time, confidence: high }
      - { opcode: 14, name: visual, confidence: high, fields: [entity-handle, visual-index] }
      - { opcode: 2, name: unreachable-2, confidence: high }
      - { opcode: 3, name: unreachable-3, confidence: high }
      - { opcode: 4, name: unreachable-4, confidence: high }
      - { opcode: 5, name: unreachable-5, confidence: high }
      - { opcode: 6, name: unreachable-6, confidence: high }
      - { opcode: 7, name: unreachable-7, confidence: high }
      - { opcode: 8, name: unreachable-8, confidence: high }
      - { opcode: 10, name: unreachable-10, confidence: high }
      - { opcode: 12, name: unreachable-12, confidence: high }
      - { opcode: 13, name: unreachable-13, confidence: high }
