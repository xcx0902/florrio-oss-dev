# Network v2 only. Worker framing remains owned by protocol.yaml.
version: 2
magic: FLR2
headerBytes: 16
limits:
  maxClientFrameBytes: 4096
  maxServerFrameBytes: 1048576
  maxSnapshotEntities: 16384
  maxSnapshotEvents: 4096
  maxEntityFieldBytes: 2048
  maxEntityFieldRecords: 16
  maxQueuedWriteBytes: 1048576
  maxQueuedCommands: 128
  maxCommandsPerTick: 4
  maxFutureInputTicks: 2
  maxPastInputTicks: 5
  maxSequenceAdvance: 1024
  commandResultWindow: 128
  inputTtlTicks: 5
  tickMs: 50
  counterDrainAt: 4294966271
motion:
  damping: 0.992
  dragScale: 124.99999999999989
  controlScale: 2.5
  strengthScale: 0.004999999888241291
  maxStrength: 200
  angleModulus: 6.283185307179586
  velocityEpsilon: 2.220446049250313e-16
  inputEventMinMs: 25
  resyncAfterMs: 1000
  historyLimit: 256
  replayTicks: 4
  correctionMs: 100
  initialDelayMs: 100
  minDelayMs: 50
  maxDelayMs: 200
  extrapolateMs: 50
  teleportRadii: 4
  teleportMinimum: 100
  snapshotLimit: 8
  clockSamples: 20
  maxRttMs: 2000
  pingIntervalMs: 1000
enums:
  CommandKind: { Spawn: 1, Swap: 2, Discard: 3, Suicide: 4, Chat: 5, Leave: 6 }
  ResultCode: { Ok: 0, StaleLife: 1, InvalidState: 2, Cooldown: 3, Duplicate: 4, InvalidSequence: 5, QueueFull: 6 }
  ErrorCode: { Protocol: 1, Version: 2, Catalog: 3, RoomFull: 4, SlowConsumer: 5, Stopping: 6, EpochExhausted: 7, SnapshotTooLarge: 8, Session: 9 }
  ResyncReason: { Gap: 1, Baseline: 2, Decode: 3 }
  EventKind: { Hit: 1, Pickup: 2, Chat: 3 }
records:
  LeaderboardEntry:
    playerId: { type: u32, min: 1 }
    nickname: { type: string, max: 128, codePoints: 32, text: nickname }
    score: { type: f32, min: 0 }
  Leaderboard:
    roomEpoch: { type: bytes, count: 16, nonzero: true }
    serverTick: { type: u32 }
    entries: { type: array, items: LeaderboardEntry, max: 8 }
  SelfState:
    lifeEpoch: { type: u32 }
    life: { type: u8, max: 3 }
    positionX: { type: f32 }
    positionY: { type: f32 }
    radius: { type: f32, min: 0 }
    arenaWidth: { type: f32, min: 0 }
    arenaHeight: { type: f32, min: 0 }
    motionScale: { type: f32, min: 0 }
    accelerationX: { type: f64 }
    accelerationY: { type: f64 }
    velocityX: { type: f64 }
    velocityY: { type: f64 }
    speed: { type: f32 }
    buttons: { type: u32, max: 3 }
    angle: { type: f32 }
    strength: { type: f32, min: 0, max: 200 }
    inputNeutral: { type: bool }
    inputExpiresTick: { type: u32 }
    nextSpawnTick: { type: u32 }
    level: { type: u8, max: 99 }
    experience: { type: f32, min: 0 }
    score: { type: f32, min: 0 }
    zoneProgress: { type: u8 }
    inventory: { type: array, items: u16, count: 16 }
    recharge: { type: array, items: u16, count: 8 }
    backpack: { type: array, items: u16, max: 16 }
    deathScore: { type: f32, min: 0 }
    deathLevel: { type: u8, max: 99 }
    kept: { type: array, items: u16, max: 10 }
    killerName: { type: string, max: 512, codePoints: 256, text: plain }
    cameraX: { type: f32 }
    cameraY: { type: f32 }
    cameraScale: { type: f32, min: 0.01, max: 10 }
  EntityUpdate:
    handle: { type: u32, min: 1 }
    ownerPlayerId: { type: u32 }
    ownerHandle: { type: u32 }
    slot: { type: u8 }
    instance: { type: u8 }
    fields: { type: bytes, max: maxEntityFieldBytes }
  TickEvent:
    tick: { type: u32 }
    ordinal: { type: u32, min: 1 }
    kind: { type: EventKind }
    target: { type: u32 }
    actorPlayerId: { type: u32 }
    actorHandle: { type: u32 }
    amount: { type: f32, min: 0 }
    slot: { type: u8 }
    text: { type: string, max: 512, codePoints: 256, text: plain }
  Hello:
    protocolVersion: { type: u16, min: 2, max: 2 }
    catalogHash: { type: string, max: 64, codePoints: 64, text: hash }
    roomId: { type: string, max: 64, codePoints: 64, text: room }
    nickname: { type: string, max: 128, codePoints: 32, text: nickname }
    resumeToken: { type: bytes, count: 32, optional: true }
  Welcome:
    roomId: { type: string, max: 64, codePoints: 64, text: room }
    roomEpoch: { type: bytes, count: 16, nonzero: true }
    playerId: { type: u32, min: 1 }
    sessionEpoch: { type: u32, min: 1 }
    tickMs: { type: u16, min: 50, max: 50 }
    serverTick: { type: u32 }
    resumeToken: { type: bytes, count: 32 }
  Input:
    inputSeq: { type: u32, min: 1 }
    lifeEpoch: { type: u32, min: 1 }
    targetTick: { type: u32 }
    buttons: { type: u32, max: 3 }
    angle: { type: f32 }
    strength: { type: f32, min: 0, max: 200 }
  Command:
    commandSeq: { type: u32, min: 1 }
    kind: { type: CommandKind }
    lifeEpoch: { type: u32 }
    slotA: { type: u8, max: 15 }
    typeA: { type: u16, max: 255 }
    slotB: { type: u8, max: 15 }
    typeB: { type: u16, max: 255 }
    text: { type: string, max: 512, codePoints: 256, text: plain }
  CommandResult:
    commandSeq: { type: u32, min: 1 }
    code: { type: ResultCode }
    nextSpawnTick: { type: u32, optional: true }
  Snapshot:
    roomEpoch: { type: bytes, count: 16, nonzero: true }
    full: { type: bool }
    snapshotSeq: { type: u32, min: 1 }
    baselineId: { type: u32, min: 1 }
    serverTick: { type: u32 }
    lastReceivedInputSeq: { type: u32 }
    lastAppliedInputSeq: { type: u32 }
    inputAppliedTick: { type: u32 }
    controlledHandle: { type: u32 }
    removed: { type: array, items: u32, max: maxSnapshotEntities }
    entities: { type: array, items: EntityUpdate, max: maxSnapshotEntities }
    selfState: { type: SelfState }
    events: { type: array, items: TickEvent, max: maxSnapshotEvents }
  ResyncRequest:
    baselineId: { type: u32 }
    snapshotSeq: { type: u32 }
    reason: { type: ResyncReason }
  Ping:
    nonce: { type: u32, min: 1 }
    serverTick: { type: u32 }
    monotonicMs: { type: f64, min: 0 }
  Pong:
    nonce: { type: u32, min: 1 }
    serverTick: { type: u32 }
    monotonicMs: { type: f64, min: 0 }
    serverMonotonicMs: { type: f64, min: 0 }
    serverTimeMs: { type: f64, min: 0 }
  Error:
    code: { type: ErrorCode }
    message: { type: string, max: 512, codePoints: 256, text: plain }
    retryable: { type: bool }
  CloseReason:
    code: { type: ErrorCode }
    message: { type: string, max: 512, codePoints: 256, text: plain }
    retryable: { type: bool }
messages:
  Hello: { id: 1, direction: client, epoch: zero }
  Welcome: { id: 2, direction: server, epoch: nonzero, matchesField: sessionEpoch }
  Input: { id: 3, direction: client, epoch: nonzero }
  Command: { id: 4, direction: client, epoch: nonzero }
  CommandResult: { id: 5, direction: server, epoch: nonzero }
  Snapshot: { id: 6, direction: server, epoch: nonzero }
  ResyncRequest: { id: 7, direction: client, epoch: nonzero }
  Ping: { id: 8, direction: both, epoch: nonzero }
  Pong: { id: 9, direction: both, epoch: nonzero }
  Error: { id: 10, direction: server, epoch: any }
  CloseReason: { id: 11, direction: server, epoch: any }
  Leaderboard: { id: 12, direction: server, epoch: nonzero }
visibility:
  publicFields: [2, 4, 7, 8, 9, 11, 12, 22, 26, 28, 31, 36, 38, 49, 50, 53, 54, 55, 59, 62]
  publicDenseGroups: [116, 120, 140, 152]
  private: [inventory, recharge, backpack, experience, zoneProgress, deathScore, deathLevel, kept, killerName, nextSpawnTick]
  entityCodec: 'protocol.yaml sparse fields; optional public dense groups, group 152 base only; each fields blob is a complete independent type-1 entity block, sequence=1 ack=0, no deletes/events'
