name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  acceptance:
    # A single checkout/toolchain builds and validates the same delivery tree.
    # No job can accidentally test a checked-in or another job's old wasm.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Read the project compiler and browser pins
        id: emsdk
        run: |
          echo "version=$(cat .emscripten-version)" >> "$GITHUB_OUTPUT"
          echo "chrome=$(cat .chromium-version)" >> "$GITHUB_OUTPUT"
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ steps.emsdk.outputs.version }}
          actions-cache-folder: emsdk-cache
      - name: Install the Chrome version used by the golden recordings
        uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: ${{ steps.emsdk.outputs.chrome }}
          install-dependencies: true
      - name: Select the pinned browser for every runner
        run: echo "CHROME_PATH=${{ steps.chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"
      - name: Restore and verify the existing frozen oracle trees
        run: node tools/prepare-reference.mjs
      - name: Isolated verification, delivery and archive regression tests
        run: node --test test/tools-*.test.mjs test/verification-gates.test.mjs
      - name: Two complete acceptance runs from source
        run: npm run test:all:twice
      # Both runs include the dist-next smoke, 8x3 production path, Chromium
      # desktop/touch suite and 600-frame budget under their own run identity.
      - name: Verify delivery identity after acceptance
        run: |
          npm run verify:dist-next
          node tools/write-current-verification.mjs --strict
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-evidence
          path: |
            reports/*tests.tap
            reports/*tests.tap.meta.json
            reports/current-verification.json
            reports/latest-run.json
            reports/perf.json
            reports/entrypoint-smoke.json
            reports/entrypoints/
            reports/runs/
            tests/parity/**/report.json
            tests/parity/visual/diff/
            tests/parity/production/
            tests/parity/next-engine/command-diff.json
            dist-next/build-manifest.json
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: verified-dist-next
          path: dist-next/
