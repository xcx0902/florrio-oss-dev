# /etc/nginx/conf.d/florr.conf
# Replace example.com, certificate paths, the static root and the upstream port.
map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

upstream florr_native {
  server 127.0.0.1:8081;
  keepalive 32;
}

server {
  listen 443 ssl http2;
  server_name florr.example.com;

  ssl_certificate     /etc/letsencrypt/live/florr.example.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/florr.example.com/privkey.pem;

  root /srv/florr/client;
  index index.html;

  location = /healthz { proxy_pass http://florr_native; access_log off; }
  location = /readyz  { proxy_pass http://florr_native; access_log off; }
  location /metrics   { return 404; }

  location /ws {
    proxy_pass http://florr_native;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 65s;
    proxy_send_timeout 65s;
    proxy_buffering off;
  }

  location / {
    try_files $uri $uri/ =404;
    add_header Cache-Control "no-cache" always;
  }
}
