# Caddyfile
# Replace example.com, the static root and the upstream port.
florr.example.com {
  root * /srv/florr/client
  encode gzip

  @internal path /metrics
  respond @internal 404

  reverse_proxy /ws* 127.0.0.1:8081 {
    header_up X-Forwarded-Proto {scheme}
    transport http {
      read_timeout 65s
      write_timeout 65s
    }
  }
  @health path /healthz /readyz
  reverse_proxy @health 127.0.0.1:8081
  file_server
  header Cache-Control "no-cache"
}
